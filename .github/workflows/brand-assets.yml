name: Brand Asset Validation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "feat/**" ]
  workflow_dispatch:

jobs:
  validate-brand-assets:
    name: Validate portfolio icons and references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate brand manifest and website references
        run: python3 ci/validate_brand_assets.py
